title: HM Nayem - Professional Portfolio
description: Statistician | Data Scientist | Regularized Regression, Count-Data Models, High-Dimensional Data & Machine Learning
theme: jekyll-theme-minimal
show_downloads: false
logo: assets/profile.png

# Social Media
github_username: Nayem-Stat
linkedin_username: hm-nayem-9039b2248
google_scholar: "https://scholar.google.com/citations?user=F09k_p4AAAAJ&hl=en&oi=ao"
email: hnayem@fiu.edu
phone: "+1 (786) 836-9846"

# Navigation Menu
navigation:
  - title: Home
    url: /
  - title: Resume
    url: /README/
  - title: Publications
    url: /PUBLICATIONS/
  - title: Presentations
    url: /PRESENTATIONS/
  - title: Projects
    url: /PROJECTS/
  - title: Skills
    url: /SKILLS/

# Site Settings
baseurl: "/portfolio"
url: "https://nayem-stat.github.io"
repository: Nayem-Stat/portfolio

# Markdown
markdown: kramdown
kramdown:
  input: GFM
  hard_wrap: false

# Plugins
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag

# Build Settings
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor/bundle/
  - vendor/cache/
  - vendor/gems/
  - vendor/ruby/
  - .git
  - .gitignore

# Collections
collections_dir: _pages
collections:
  pages:
    output: true
    permalink: /:name/

defaults:
  - scope:
      path: ""
    values:
      layout: "default"
